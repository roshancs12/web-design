<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #display{
      width:300px;
      height:300px;
      border:solid 2px;
    }
  </style>
</head>
<body>
  <div id="display"></div>

  <button onclick="color('red')">red</button>
  <button onclick="color('green')">green</button>

  <script>
    function color(col){
      document.getElementById("display").style.background=col
    
    }
  </script>
</body>
</html>
